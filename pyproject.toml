[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-updater"
version = "0.1.0"
description = "Replicate PostgreSQL servers/databases across versions with verification."
requires-python = ">=3.10"

[project.scripts]
postgres-updater = "postgres_updater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
